#
# ਸੁਰੱਖਿਆ ਜਾਂਚ · Security scan
#
# Runs every Monday at 06:17 India time (00:47 UTC), on every push to main, on every pull
# request, and whenever someone presses "Run workflow" on the Actions tab.
#
#   checks     tools/security_check.py: page security policy, URL allowlists, SVG safety,
#              data paths and licences, image metadata, committed secrets, workflow pinning
#   site       the full browser test suite, including the security and privacy checks
#   deps       npm audit of the (only) dependency, Playwright, using the exact lockfile
#   codeql     GitHub's code analysis of the JavaScript, the Python tools and these workflows
#
# If the weekly run fails, GitHub emails the repository owner. Results of CodeQL appear under
# Security → Code scanning. Every action is pinned to an exact commit; Dependabot proposes updates.

name: security

on:
  schedule:
    - cron: "47 0 * * 1"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "pillow==11.*"
      - run: python tools/security_check.py

  site:
    name: Website tests (incl. security & privacy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deps:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm audit --audit-level=moderate
      - run: npm audit signatures

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
